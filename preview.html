<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>preview</title>
<style>
  html, body { margin: 0; padding: 0; background: #B9BEC7; }
  #wrap { position: relative; overflow: hidden; }
  iframe { border: 0; position: absolute; top: 0; left: 0; transform-origin: top left; background: #fff; }
</style>
</head>
<body>
<div id="wrap"></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var w = parseInt(q.get("w") || "390", 10);
  var h = parseInt(q.get("h") || "844", 10);
  var z = parseFloat(q.get("z") || "1");
  var p = q.get("p") || "./";
  var wrap = document.getElementById("wrap");
  wrap.style.width = (w * z) + "px";
  wrap.style.height = (h * z) + "px";
  var f = document.createElement("iframe");
  f.src = p;
  f.style.width = w + "px";
  f.style.height = h + "px";
  f.style.transform = "scale(" + z + ")";
  f.setAttribute("title", "preview");
  wrap.appendChild(f);
})();
</script>
</body>
</html>
