<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>mobile preview</title>
<style>
  html,body{margin:0;background:#1b1b1b}
  .stage{width:390px;margin:0 auto;background:#fff}
  iframe{width:390px;height:844px;border:0;display:block}
</style></head>
<body>
<div class="stage"><iframe id="f" src="../index.html" title="mobile"></iframe></div>
<script>
  var p = new URLSearchParams(location.search);
  var s = p.get("s"), lang = p.get("lang"), h = p.get("h");
  var src = "../index.html";
  src += "?cb=" + Date.now();
  if (lang) src += "&lang=" + lang;
  if (s) src += "#" + s;
  var f = document.getElementById("f");
  if (h) f.style.height = h + "px";
  f.src = src;
</script>
</body>
</html>
