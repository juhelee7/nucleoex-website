<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 | NucleoEX</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon-64.png" sizes="64x64" type="image/png">
<link rel="stylesheet" href="/assets/css/main.css?v=2026112401">
<script>
/* 옛 아임웹 사이트(하위 메뉴) 주소로 들어온 방문자를 새 홈페이지의 해당 섹션으로 즉시 이동시킨다.
   예) /company, /greeting, /item, /contact, /organization  ->  https://nucleoex.com/#about 등 */
(function () {
  var BASE = "https://nucleoex.com/";
  var path = location.pathname || "/";

  try { path = decodeURIComponent(path); } catch (e) {}
  path = path.toLowerCase().replace(/\/+$/, "");
  if (!path) { path = "/"; }

  /* 홈 자체가 404로 떨어진 경우에는 리다이렉트 루프를 피하기 위해 그대로 둔다. */
  if (path === "/" || path === "/index.html") { return; }

  var segs = path.split("/").filter(function (s) { return s !== ""; });
  var lang = "";
  if (segs.length && (segs[0] === "en" || segs[0] === "eng")) {
    lang = "en";
    segs = segs.slice(1);
  }

  var key = segs.length ? segs[0] : "";

  /* 위에서부터 먼저 맞는 규칙을 쓴다. 접두사 비교라 /items, /technology, /organization 도 함께 걸린다. */
  var RULES = [
    { hash: "#ceo",        keys: ["greeting", "ceo", "message"] },
    { hash: "#contact",    keys: ["contact", "inquiry", "qna", "location", "map", "directions"] },
    { hash: "#technology", keys: ["item", "product", "tech", "business", "rnd", "research"] },
    { hash: "#about",      keys: ["company", "about", "intro", "history", "org", "vision", "overview", "profile", "team", "patent", "certification"] }
  ];

  var cands = [key].concat(segs.slice(1));
  var hash = null;
  for (var i = 0; i < RULES.length && !hash; i++) {
    var keys = RULES[i].keys;
    for (var c = 0; c < cands.length && !hash; c++) {
      if (!cands[c]) { continue; }
      for (var j = 0; j < keys.length; j++) {
        if (cands[c] === keys[j] || cands[c].indexOf(keys[j]) === 0) { hash = RULES[i].hash; break; }
      }
    }
  }

  var m = /(?:^|[?&])lang=([^&]+)/i.exec(location.search || "");
  if (!lang && m) { lang = m[1]; }
  var query = lang ? "?lang=" + encodeURIComponent(lang) : "";

  window.location.replace(BASE + query + (hash || ""));
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=https://nucleoex.com/"></noscript>
<style>
  .nf{min-height:100svh;display:flex;align-items:center;justify-content:center;background:var(--navy-950);color:#fff;text-align:center;padding:40px 20px;position:relative;overflow:hidden}
  .nf::before{content:"";position:absolute;inset:0;background:radial-gradient(52% 48% at 86% 8%,rgba(232,93,63,.20),transparent 62%),radial-gradient(50% 52% at 0% 96%,rgba(16,185,129,.22),transparent 72%)}
  .nf-inner{position:relative;z-index:1;max-width:520px}
  .nf img{height:32px;width:auto;margin:0 auto 40px}
  .nf-code{font-size:13px;letter-spacing:.12em;color:var(--brand-300);font-weight:600;margin-bottom:18px}
  .nf h1{font-size:clamp(26px,5vw,38px);letter-spacing:-.03em;line-height:1.3;margin-bottom:14px;word-break:keep-all}
  .nf p{color:rgba(255,255,255,.6);font-size:15px;line-height:1.7;margin-bottom:32px;word-break:keep-all}
  .nf .btn{margin:0 4px}
</style>
</head>
<body>
  <main class="nf">
    <div class="nf-inner">
      <img src="/assets/img/logo-white.png" alt="NucleoEX">
      <p class="nf-code">404</p>
      <h1>페이지를 찾을 수 없습니다</h1>
      <p>The page you are looking for has moved or no longer exists.<br>잠시 후 홈페이지로 이동합니다.</p>
      <a class="btn btn-primary" href="/">홈으로 돌아가기</a>
      <a class="btn btn-ghost" href="/?lang=en">Back to home (EN)</a>
    </div>
  </main>
</body>
</html>
